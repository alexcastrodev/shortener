<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #101418; --fg: #eef2f5; --card: #151b20; --muted: #a7b0bc;
    --border: #29333c; --primary: #4fb5b3; --accent: #183436;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }
  body { font-family: 'Geist', sans-serif; color: var(--fg); position: relative; -webkit-font-smoothing: antialiased; }

  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgb(238 242 245 / 0.06) 1px, transparent 1px),
      linear-gradient(to bottom, rgb(238 242 245 / 0.06) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse 80% 90% at 70% 20%, #000 30%, transparent 85%);
  }
  .glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 45% 55% at 78% 8%, rgb(79 181 179 / 0.30), transparent 70%),
      radial-gradient(ellipse 35% 40% at 8% 100%, rgb(79 181 179 / 0.12), transparent 70%);
  }

  .left { position: absolute; left: 72px; top: 64px; bottom: 64px; width: 600px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .mark { filter: drop-shadow(0 10px 24px rgb(0 0 0 / 0.4)); }
  .name { font-size: 44px; font-weight: 700; letter-spacing: -0.045em; }
  .period { display: inline-block; width: 0.3em; height: 0.3em; margin-left: 2px; border-radius: 50%; background: var(--primary); }

  h1 {
    margin-top: auto; font-size: 76px; line-height: 1.02; font-weight: 650; letter-spacing: -0.045em;
    background: linear-gradient(180deg, var(--fg) 35%, rgb(238 242 245 / 0.62));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h1 .accent { background: linear-gradient(90deg, #6fd3d0, var(--primary)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin-top: 22px; font-size: 26px; line-height: 1.35; color: var(--muted); max-width: 470px; }
  .footer { margin-top: 34px; display: flex; align-items: center; gap: 12px; font-size: 21px; color: var(--muted); }
  .url { font-family: 'Geist Mono', monospace; color: var(--fg); font-weight: 500; }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--border); }
  .pill { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border); background: rgb(21 27 32 / 0.8); font-size: 18px; }

  /* Product scene */
  .phone {
    position: absolute; right: 80px; top: 52px; width: 300px; height: 540px; border-radius: 40px;
    background: linear-gradient(180deg, #0f4b5c, #0b2d44 60%, #0a2236);
    border: 1px solid rgb(255 255 255 / 0.12);
    box-shadow: 0 40px 80px rgb(0 0 0 / 0.55), 0 0 0 10px rgb(21 27 32 / 0.9), 0 0 0 11px var(--border);
    padding: 44px 24px; display: flex; flex-direction: column; align-items: center;
    transform: rotate(4deg);
  }
  .avatar { width: 84px; height: 84px; border-radius: 50%; background: linear-gradient(135deg, #7fd6d3, #3bb7b4); display: grid; place-items: center; font-size: 36px; font-weight: 700; color: #063c3b; border: 3px solid rgb(255 255 255 / 0.85); }
  .p-title { margin-top: 14px; font-size: 22px; font-weight: 650; color: #fff; }
  .p-bio { margin-top: 4px; font-size: 14px; color: rgb(255 255 255 / 0.7); }
  .socials { margin-top: 14px; display: flex; gap: 14px; }
  .socials svg { width: 24px; height: 24px; color: rgb(255 255 255 / 0.9); }
  .link { margin-top: 12px; width: 100%; height: 46px; border-radius: 12px; background: rgb(255 255 255 / 0.92); color: #0b2d44; font-size: 15px; font-weight: 600; display: grid; place-items: center; }
  .link:first-of-type { margin-top: 22px; }
  .section { margin-top: 18px; font-size: 11px; letter-spacing: .16em; font-weight: 700; color: rgb(255 255 255 / 0.75); }

  .short {
    position: absolute; right: 268px; top: 452px; width: 320px; padding: 18px 20px; border-radius: 18px;
    background: rgb(21 27 32 / 0.92); border: 1px solid var(--border);
    box-shadow: 0 24px 60px rgb(0 0 0 / 0.5); backdrop-filter: blur(8px);
    transform: rotate(-3deg);
  }
  .short-top { display: flex; align-items: center; gap: 10px; }
  .short-icon { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: var(--primary); display: grid; place-items: center; }
  .short-url { font-family: 'Geist Mono', monospace; font-size: 19px; font-weight: 600; }
  .short-meta { margin-top: 12px; display: flex; align-items: flex-end; justify-content: space-between; }
  .clicks { font-size: 30px; font-weight: 650; letter-spacing: -0.02em; }
  .clicks small { display: block; font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
  .bars { display: flex; align-items: flex-end; gap: 5px; height: 40px; }
  .bars i { display: block; width: 9px; border-radius: 3px; background: var(--primary); opacity: .9; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>

  <div class="left">
    <div class="brand">
      <svg class="mark" viewBox="0 0 64 64" width="60" height="60">
        <defs>
          <linearGradient id="kurz-top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7ae0dc"/><stop offset="1" stop-color="#2fa9a5"/></linearGradient>
          <linearGradient id="kurz-bottom" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f8f8b"/><stop offset="1" stop-color="#136e6b"/></linearGradient>
        </defs>
        <rect width="64" height="64" rx="15" fill="#151b20"/>
        <rect x=".75" y=".75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="#29333c" stroke-width="1.5"/>
        <rect x="14" y="13" width="10" height="38" rx="2.5" fill="#eef2f5"/>
        <path d="M27 32H38.5L52 51H40.5Z" fill="url(#kurz-bottom)"/>
        <path d="M27 32L40.5 13H52L38.5 32Z" fill="url(#kurz-top)"/>
      </svg>
      <div class="name">kurz<span class="period"></span></div>
    </div>

    <h1>Short links.<br>Bio pages.<br><span class="accent">Every click.</span></h1>
    <p class="sub">Shorten, share and track links, and put all of yours on one page.</p>

    <div class="footer">
      <span class="url">kurz.fyi</span>
      <span class="dot"></span>
      <span class="pill">Free</span>
      <span class="pill">Open source</span>
    </div>
  </div>

  <div class="phone">
    <div class="avatar">M</div>
    <div class="p-title">Marina Costa</div>
    <div class="p-bio">Designer &amp; illustrator</div>
    <div class="socials">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="12" cy="12" r="3"/><path d="M16.5 7.5v.01"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l11.733 16h4.267l-11.733 -16z"/><path d="M4 20l6.768 -6.768m2.46 -2.46l6.772 -6.772"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8a4 4 0 0 1 4 -4h12a4 4 0 0 1 4 4v8a4 4 0 0 1 -4 4h-12a4 4 0 0 1 -4 -4v-8z"/><path d="M10 9l5 3l-5 3z"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7.917v4.034a9.948 9.948 0 0 1 -5 -1.951v4.5a6.5 6.5 0 1 1 -8 -6.326v4.326a2.5 2.5 0 1 0 4 2v-11.5h4.083a6.005 6.005 0 0 0 4.917 4.917z"/></svg>
    </div>
    <div class="link">Portfolio</div>
    <div class="link">Book a call</div>
    <div class="section">SHOP</div>
    <div class="link">Prints &amp; posters</div>
    <div class="link">Newsletter</div>
  </div>

  <div class="short">
    <div class="short-top">
      <div class="short-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15l6 -6"/><path d="M11 6l.463 -.536a5 5 0 0 1 7.071 7.072l-.534 .464"/><path d="M13 18l-.397 .534a5.068 5.068 0 0 1 -7.127 0a4.972 4.972 0 0 1 0 -7.071l.524 -.463"/></svg>
      </div>
      <div class="short-url">kurz.fyi/launch</div>
    </div>
    <div class="short-meta">
      <div class="clicks">2,847<small>clicks this week</small></div>
      <div class="bars"><i style="height:30%"></i><i style="height:45%"></i><i style="height:38%"></i><i style="height:62%"></i><i style="height:55%"></i><i style="height:80%"></i><i style="height:100%"></i></div>
    </div>
  </div>
</body>
</html>
