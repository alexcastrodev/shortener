name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build images
        run: |
          build() {
            docker build -f "$2" \
              -t "pizito:5001/$1:latest" \
              -t "pizito:5001/$1:${{ github.sha }}" .
          }
          build shortener .ci/Dockerfile
          build shortener-frontend .ci/Dockerfile.frontend
          build shortener-edge .ci/Dockerfile.edge

      - name: Push images
        run: |
          for image in shortener shortener-frontend shortener-edge; do
            docker push "pizito:5001/$image:latest"
            docker push "pizito:5001/$image:${{ github.sha }}"
          done

      - name: Deploy stacks to swarm
        run: ./deploy.sh
