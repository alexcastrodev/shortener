name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:8.1.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RAILS_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Enables the redirect cache and rate limiting specs.
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      # config/initializers/vips.rb loads libvips at boot. On Ubuntu the HEVC
      # decoder for HEIC avatars is only suggested by libheif, so add it.
      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips libheif-plugin-libde265
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: backend
          bundler-cache: true
      - name: Lint
        run: bundle exec rubocop
      - name: Security scan
        run: bundle exec brakeman --no-pager --quiet
      - name: Set up database
        run: bin/rails db:create db:schema:load
      - name: Test
        run: bundle exec rspec

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:8.1.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.31.4
        ports: ["1025:1025", "8025:8025"]
        options: >-
          --health-cmd "/mailpit readyz" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RAILS_ENV: e2e
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_URL: redis://localhost:6379/0
      E2E_START_SERVERS: "1"
      E2E_SMTP_HOST: localhost
      MAILPIT_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@v7
      - name: Generate the e2e secret
        run: echo "SECRET_KEY_BASE=$(openssl rand -hex 64)" >> "$GITHUB_ENV"
      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips libheif-plugin-libde265
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: backend
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install e2e dependencies
        run: npm ci
        working-directory: e2e
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: e2e
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium
        working-directory: e2e
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - name: Set up database and accounts
        run: bin/rails db:create db:schema:load && bin/rails runner ../e2e/support/seed.rb
        working-directory: backend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
          VITE_BASE_URL: http://localhost:3000
          VITE_TURNSTILE_SITE_KEY: ""
      - name: End-to-end tests
        run: npx playwright test
        working-directory: e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  edge-function:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge-function
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Lint
        run: deno lint
      - name: Typecheck
        run: deno check index.ts
      - name: Test
        run: deno test
