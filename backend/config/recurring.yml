#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  expire_inactive_shortlinks:
    class: ExpireInactiveShortlinksJob
    queue: default
    schedule: at 3am every day
  cleanup_orphan_form_uploads:
    class: CleanupOrphanFormUploadsJob
    queue: default
    schedule: every 15 minutes
  detect_form_abuse:
    class: DetectFormAbuseJob
    queue: default
    schedule: every 10 minutes
  purge_old_ip_addresses:
    class: PurgeOldIpAddressesJob
    queue: default
    schedule: at 4:15am every day
  purge_deleted_accounts:
    class: PurgeDeletedAccountsJob
    queue: default
    schedule: at 4:30am every day
  purge_mcp_tool_calls:
    class: PurgeMcpToolCallsJob
    queue: default
    schedule: at 4am every day
  expire_scheduled_shortlinks:
    class: ExpireScheduledShortlinksJob
    queue: default
    schedule: every 5 minutes
  cleanup_stale_avatar_uploads:
    class: CleanupStaleAvatarUploadsJob
    queue: default
    schedule: every 15 minutes
  recheck_page_links_safety:
    class: RecheckPageLinksSafetyJob
    queue: safety
    schedule: at 4am every day
  detect_page_abuse:
    class: DetectPageAbuseJob
    queue: default
    schedule: every hour at minute 40
  cleanup_unverified_users:
    class: CleanupUnverifiedUsersJob
    queue: default
    schedule: every day at 3:30am
  purge_old_notifications:
    class: PurgeOldNotificationsJob
    queue: default
    schedule: at 4:45am every day
