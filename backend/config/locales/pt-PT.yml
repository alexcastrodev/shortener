pt-PT:
  date:
    day_names: [domingo, segunda-feira, terça-feira, quarta-feira, quinta-feira, sexta-feira, sábado]
    abbr_day_names: [dom, seg, ter, qua, qui, sex, sáb]
    month_names: [~, janeiro, fevereiro, março, abril, maio, junho, julho, agosto, setembro, outubro, novembro, dezembro]
    abbr_month_names: [~, jan, fev, mar, abr, mai, jun, jul, ago, set, out, nov, dez]
    formats:
      mail_date: "%-d de %B de %Y"
  time:
    formats:
      mail_day: "%A, %-d de %B"
      mail_day_year: "%A, %-d de %B de %Y"
      mail_hour: "%H:%M"
      mail_moment: "%A, %-d de %B, às %H:%M"
      mail_short: "%a, %-d %b, %H:%M"
  number:
    format:
      separator: ","
  mailer:
    status:
      confirmed: "Confirmada"
      new_booking: "Nova marcação"
      pending: "Por aprovar"
      verify: "Por confirmar"
      waitlist: "Lista de espera"
      offered: "Lugar disponível"
      reminder: "Lembrete"
      rescheduled: "Novo horário"
      cancelled: "Cancelada"
      declined: "Recusada"
      deletion: "Eliminação marcada"
    service: "Serviço"
    when: "Quando"
    sessions:
      one: "1 sessão"
      other: "%{count} sessões"
    with: "Com"
    client: "Cliente"
    total: "Total"
    free:
      one: "%{count} sessão grátis"
      other: "%{count} sessões grátis"
    zone: "Fuso horário: %{zone}"
    someone: "Alguém"
    see_responses: "Ver nas suas respostas"
    on_behalf: "Enviado pelo Kurz em nome de %{form}."
    reply: "Responda a este e-mail para falar com %{form}."
    why_client: "Recebe este e-mail porque este endereço foi usado para marcar com %{form}."
    why_waitlist: "Recebe este e-mail porque este endereço entrou na lista de espera de %{form}."
    why_owner: "Recebe este e-mail porque %{form} é um dos seus formulários no Kurz."
    why_account: "Recebe este e-mail porque diz respeito à conta Kurz %{email}."
    settings: "Escolher que e-mails recebe"
  login_mailer:
    copy:
      sign_in:
        subject: "%{code} é o seu código de acesso ao Kurz"
        title: "O seu código de acesso"
        body: "Introduza este código na página de acesso do Kurz para continuar."
        reason: "alguém pediu para entrar no Kurz com %{email}"
      sign_up:
        subject: "%{code} é o seu código de confirmação do Kurz"
        title: "Confirme a sua nova conta"
        body: "Introduza este código para concluir a criação da sua conta Kurz."
        reason: "alguém começou a criar uma conta Kurz com %{email}"
      sign_up_existing:
        subject: "%{code} é o seu código de confirmação do Kurz"
        title: "Confirme que é você"
        body: "Este e-mail já tem uma conta Kurz. Introduza este código para concluir a inscrição: a palavra-passe que acabou de escolher passa a ser a sua palavra-passe e as outras sessões são terminadas."
        reason: "alguém tentou criar uma conta Kurz com %{email}"
      password_reset:
        subject: "%{code} é o seu código para repor a palavra-passe do Kurz"
        title: "Repor a palavra-passe"
        body: "Introduza este código para escolher uma nova palavra-passe para a sua conta Kurz."
        reason: "alguém pediu para repor a palavra-passe da conta Kurz %{email}"
    magic_link:
      preview: "Expira em %{minutes} minutos."
      expires: "O código expira em %{minutes} minutos e só pode ser usado uma vez."
      footer: "Está a receber este e-mail porque %{reason}. Se não foi você, pode ignorá-lo."
  account_mailer:
    data_export:
      subject: "Os seus dados do Kurz"
      title: "Os seus dados seguem em anexo"
      body: "Pediu uma cópia dos seus dados. O ficheiro JSON em anexo tem a sua conta, ligações curtas, páginas de bio, formulários e respostas, aplicações ligadas e paletas guardadas."
      leaves_out: "Não inclui palavras-passe, tokens nem os endereços IP dos seus visitantes."
      not_you: "Se não pediu isto, inicie sessão e mude a palavra-passe: alguém pode ter acesso à sua conta."
    data_export_too_large:
      subject: "Os seus dados do Kurz são demasiado grandes para enviar"
      title: "Não conseguimos enviar os seus dados"
      body: "Há demasiados dados para um só e-mail. Exporte os maiores formulários para Excel a partir da página de respostas, ou responda a este endereço e enviamos-lhe uma cópia de outra forma."
    deletion_scheduled:
      subject: "A sua conta Kurz está marcada para eliminação"
      title: "A sua conta será eliminada a %{date}"
      body: "Pediu para eliminar a conta Kurz %{email}. Os seus links, páginas de bio, formulários, respostas e ficheiros carregados estão offline neste momento e serão eliminados definitivamente a %{date}."
      changed_mind: "Mudou de ideias? Inicie sessão antes de %{date} e a eliminação é cancelada; os seus links e páginas voltam."
      sign_in: "Entrar e manter a minha conta"
      not_you: "Se não foi você que pediu isto, inicie sessão para cancelar e altere a sua palavra-passe."
  waitlist_mailer:
    joined:
      subject: "Está na lista de espera: %{service} · %{time}"
      title: "Está na lista de espera"
      lead: "%{service} está cheio nesse horário. Se abrir um lugar, avisamos por e-mail."
      how: "Terá então um tempo limitado para o confirmar. Nada fica marcado até o fazer."
      leave_link: "Sair da lista de espera"
    offered:
      subject: "Abriu um lugar: %{service} · %{time}"
      title: "Abriu um lugar para si"
      lead: "%{service} tem um lugar livre, guardado para si durante pouco tempo."
      until: "Confirme antes de %{time}, ou o lugar passa para a pessoa seguinte."
      confirm_link: "Confirmar o meu lugar"
  appointment_mailer:
    confirmed:
      subject: "Confirmada: %{service} · %{time}"
      title: "A sua marcação está confirmada"
      lead: "Está tudo tratado. Guarde este e-mail: tem a ligação para ver ou cancelar a marcação."
      manage_link: "Ver ou cancelar a sua marcação"
    verify:
      subject: "Confirme a sua marcação: %{service} · %{time}"
      title: "Confirme o seu e-mail para manter a marcação"
      lead: "O seu lugar está guardado. Confirme que este é o seu endereço de e-mail e a marcação fica feita."
      hold: "O lugar fica guardado durante %{minutes} minutos."
      confirm_link: "Confirmar o meu e-mail"
      ignore: "Se não pediu isto, ignore este e-mail e o lugar é libertado."
    request_received:
      subject: "Pedido recebido: %{service} · %{time}"
      title: "Recebemos o seu pedido de marcação"
      lead: "%{form} ainda tem de o aprovar. Receberá outro e-mail assim que for decidido."
      manage_link: "Ver ou cancelar o seu pedido"
    new_request:
      subject: "Marcação por aprovar: %{service} · %{name} · %{time}"
      title: "Há uma marcação à espera da sua aprovação"
      lead: "%{name} pediu para marcar %{service}."
      decide_link: "Aprovar ou recusar"
      deadline_decline: "Sem resposta até %{deadline}, o pedido é recusado e o horário é libertado."
      deadline_accept: "Sem resposta até %{deadline}, a marcação fica confirmada."
    declined:
      subject: "Não confirmada: %{service} · %{time}"
      title: "O seu pedido de marcação foi recusado"
      lead: "%{form} não conseguiu confirmar este horário. Lamentamos."
      message: "Mensagem de %{form}"
      book_again: "Escolher outro horário"
    reminder:
      subject: "Lembrete: %{service} · %{time}"
      title: "A sua marcação aproxima-se"
      lead: "Aqui ficam os detalhes, para o caso de precisar deles."
      manage_link: "Ver ou cancelar a sua marcação"
    rescheduled:
      subject: "Horário alterado: %{service} · %{time}"
      title: "A sua marcação tem um novo horário"
      lead: "%{form} mudou a sua marcação. O novo horário está abaixo."
      was: "Antes"
      message: "Mensagem de %{form}"
      manage_link: "Ver ou cancelar a sua marcação"
    cancelled:
      subject: "Cancelada: %{service} · %{time}"
      title: "A sua marcação foi cancelada"
      lead_client: "Como pediu, esta marcação está cancelada. Não precisa de fazer mais nada."
      lead_owner: "Lamentamos: %{form} teve de cancelar esta marcação."
      book_again: "Marcar novamente"
    owner_cancelled:
      subject: "Marcação cancelada: %{service} · %{name} · %{time}"
      title: "Uma marcação foi cancelada"
      lead: "%{name} cancelou %{service}. O horário ficou livre."
      reason: "Motivo"
    new_booking:
      subject: "Nova marcação: %{service} · %{name} · %{time}"
      title: "Tem uma nova marcação"
      lead: "%{name} marcou %{service}."
