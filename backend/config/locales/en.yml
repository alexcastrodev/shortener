# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  errors:
    form_error: 'Fields are not valid'
    account_deactivated: "Your account has been deactivated"
  date:
    day_names: [Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday]
    abbr_day_names: [Sun, Mon, Tue, Wed, Thu, Fri, Sat]
    month_names: [~, January, February, March, April, May, June, July, August, September, October, November, December]
    abbr_month_names: [~, Jan, Feb, Mar, Apr, May, Jun, Jul, Aug, Sep, Oct, Nov, Dec]
    formats:
      mail_date: "%-d %B %Y"
  time:
    formats:
      mail_day: "%A %-d %B"
      mail_day_year: "%A %-d %B %Y"
      mail_hour: "%H:%M"
      mail_moment: "%A %-d %B at %H:%M"
      mail_short: "%a %-d %b, %H:%M"
  number:
    format:
      separator: "."
    currency:
      format:
        format: "%u%n"
        separator: "."
        delimiter: ","
  mailer:
    status:
      confirmed: "Confirmed"
      new_booking: "New booking"
      pending: "Awaiting approval"
      verify: "To confirm"
      waitlist: "Waiting list"
      offered: "Place available"
      reminder: "Reminder"
      rescheduled: "New time"
      cancelled: "Cancelled"
      declined: "Declined"
      deletion: "Deletion scheduled"
    service: "Service"
    when: "When"
    sessions:
      one: "1 session"
      other: "%{count} sessions"
    with: "With"
    client: "Client"
    total: "Total"
    free:
      one: "%{count} free session"
      other: "%{count} free sessions"
    zone: "Time zone: %{zone}"
    someone: "Someone"
    see_responses: "See it in your responses"
    on_behalf: "Sent by Kurz on behalf of %{form}."
    reply: "Reply to this email to reach %{form}."
    why_client: "You are getting this because this address was used to book with %{form}."
    why_waitlist: "You are getting this because this address joined the waiting list of %{form}."
    why_owner: "You are getting this because %{form} is one of your forms on Kurz."
    why_account: "You are getting this because it is about the Kurz account %{email}."
    settings: "Choose which emails you get"
  login_mailer:
    copy:
      sign_in:
        subject: "%{code} is your Kurz sign-in code"
        title: "Your sign-in code"
        body: "Enter this code on the Kurz sign-in page to continue."
        reason: "someone asked to sign in to Kurz with %{email}"
      sign_up:
        subject: "%{code} is your Kurz confirmation code"
        title: "Confirm your new account"
        body: "Enter this code to finish creating your Kurz account."
        reason: "someone started creating a Kurz account with %{email}"
      sign_up_existing:
        subject: "%{code} is your Kurz confirmation code"
        title: "Confirm it's you"
        body: "This email already has a Kurz account. Enter this code to finish signing up: the password you just chose becomes your password, and other sessions are signed out."
        reason: "someone tried to create a Kurz account with %{email}"
      password_reset:
        subject: "%{code} is your Kurz password reset code"
        title: "Reset your password"
        body: "Enter this code to choose a new password for your Kurz account."
        reason: "someone asked to reset the password of the Kurz account %{email}"
    magic_link:
      preview: "It expires in %{minutes} minutes."
      expires: "The code expires in %{minutes} minutes and works once."
      footer: "You're getting this because %{reason}. If it wasn't you, you can ignore this email."
  account_mailer:
    data_export:
      subject: "Your Kurz data"
      title: "Your data is attached"
      body: "You asked for a copy of your data. The attached JSON file has your account, short links, bio pages, forms and their responses, connected apps and saved palettes."
      leaves_out: "It leaves out passwords, tokens and your visitors' IP addresses."
      not_you: "If you did not ask for this, sign in and change your password: someone may have access to your account."
    data_export_too_large:
      subject: "Your Kurz data is too large to send"
      title: "We could not send your data"
      body: "There is too much data for one email. Export your biggest forms to Excel from their responses page, or reply to this address and we will send you a copy another way."
    deletion_scheduled:
      subject: "Your Kurz account is scheduled for deletion"
      title: "Your account will be deleted on %{date}"
      body: "You asked to delete the Kurz account %{email}. Your links, bio pages, forms, responses and uploaded files are offline now and will be permanently deleted on %{date}."
      changed_mind: "Changed your mind? Sign in before %{date} and the deletion is cancelled; your links and pages come back."
      sign_in: "Sign in to keep my account"
      not_you: "If you did not ask for this, sign in to cancel it and change your password."
  waitlist_mailer:
    joined:
      subject: "You are on the waiting list: %{service} · %{time}"
      title: "You are on the waiting list"
      lead: "%{service} is full at that time. If a place opens, we will email you."
      how: "You will then have a limited time to confirm it. Nothing is booked until you do."
      leave_link: "Leave the waiting list"
    offered:
      subject: "A place opened: %{service} · %{time}"
      title: "A place opened for you"
      lead: "%{service} has a free place, held for you for a short while."
      until: "Confirm before %{time}, or it goes to the next person."
      confirm_link: "Confirm my place"
  appointment_mailer:
    confirmed:
      subject: "Confirmed: %{service} · %{time}"
      title: "Your booking is confirmed"
      lead: "You're all set. Keep this email: it has the link to see or cancel your booking."
      manage_link: "View or cancel your booking"
    verify:
      subject: "Confirm your booking: %{service} · %{time}"
      title: "Confirm your email to keep your booking"
      lead: "Your place is held. Confirm this is your email address and the booking is done."
      hold: "The place is held for %{minutes} minutes."
      confirm_link: "Confirm my email address"
      ignore: "If you did not ask for this, ignore this email and the place is released."
    request_received:
      subject: "Request received: %{service} · %{time}"
      title: "We received your booking request"
      lead: "%{form} still has to approve it. You will get another email as soon as it is decided."
      manage_link: "View or cancel your request"
    new_request:
      subject: "Booking to approve: %{service} · %{name} · %{time}"
      title: "A booking is waiting for your approval"
      lead: "%{name} asked to book %{service}."
      decide_link: "Approve or decline"
      deadline_decline: "Without an answer by %{deadline}, the request is declined and the time is released."
      deadline_accept: "Without an answer by %{deadline}, the booking is confirmed."
    declined:
      subject: "Not confirmed: %{service} · %{time}"
      title: "Your booking request was declined"
      lead: "%{form} could not confirm this time. Sorry about that."
      message: "Message from %{form}"
      book_again: "Choose another time"
    reminder:
      subject: "Reminder: %{service} · %{time}"
      title: "Your booking is coming up"
      lead: "Here are the details, in case you need them."
      manage_link: "View or cancel your booking"
    rescheduled:
      subject: "Time changed: %{service} · %{time}"
      title: "Your booking has a new time"
      lead: "%{form} moved your booking. The new time is below."
      was: "Before"
      message: "Message from %{form}"
      manage_link: "View or cancel your booking"
    cancelled:
      subject: "Cancelled: %{service} · %{time}"
      title: "Your booking was cancelled"
      lead_client: "As you asked, this booking is cancelled. There is nothing else to do."
      lead_owner: "Sorry: %{form} had to cancel this booking."
      book_again: "Book again"
    owner_cancelled:
      subject: "Booking cancelled: %{service} · %{name} · %{time}"
      title: "A booking was cancelled"
      lead: "%{name} cancelled %{service}. The time is free again."
      reason: "Reason"
    new_booking:
      subject: "New booking: %{service} · %{name} · %{time}"
      title: "You have a new booking"
      lead: "%{name} booked %{service}."
