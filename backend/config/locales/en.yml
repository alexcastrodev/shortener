# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  errors:
    form_error: 'Fields are not valid'
    account_deactivated: "Your account has been deactivated"
  login_mailer:
    copy:
      sign_in:
        subject: "%{code} is your Kurz sign-in code"
        title: "Your sign-in code"
        body: "Enter this code on the Kurz sign-in page to continue."
        reason: "someone asked to sign in to Kurz with %{email}"
      sign_up:
        subject: "%{code} is your Kurz confirmation code"
        title: "Confirm your new account"
        body: "Enter this code to finish creating your Kurz account."
        reason: "someone started creating a Kurz account with %{email}"
      sign_up_existing:
        subject: "%{code} is your Kurz confirmation code"
        title: "Confirm it's you"
        body: "This email already has a Kurz account. Enter this code to finish signing up: the password you just chose becomes your password, and other sessions are signed out."
        reason: "someone tried to create a Kurz account with %{email}"
      password_reset:
        subject: "%{code} is your Kurz password reset code"
        title: "Reset your password"
        body: "Enter this code to choose a new password for your Kurz account."
        reason: "someone asked to reset the password of the Kurz account %{email}"
    magic_link:
      preview: "It expires in %{minutes} minutes."
      expires: "The code expires in %{minutes} minutes and works once."
      footer: "You're getting this because %{reason}. If it wasn't you, you can ignore this email."
  account_mailer:
    deletion_scheduled:
      subject: "Your Kurz account is scheduled for deletion"
      body: "You asked to delete the Kurz account %{email}. Your links, bio pages, forms, responses and uploaded files are offline now and will be permanently deleted on %{date}."
      changed_mind: "Changed your mind? Sign in to Kurz before %{date} and the deletion is cancelled; your links and pages come back."
      not_you: "If you did not ask for this, sign in to cancel it and change your password."
  appointment_mailer:
    confirmed:
      subject: "Confirmed: %{service}, %{time}"
      title: "Your booking is confirmed"
      intro: "%{service} is booked for:"
      reply: "Questions? Reply to this email to reach the organizer."
      manage: "See or cancel your booking: %{url}"
      manage_link: "See or cancel your booking"
    request_received:
      subject: "Request received: %{service}"
      title: "We received your booking request"
      intro: "%{service} is waiting for the organizer's approval:"
      reply: "You will get another email as soon as it is decided. Questions? Reply to this email."
      manage: "See or cancel your request: %{url}"
      manage_link: "See or cancel your request"
    new_request:
      subject: "Booking to approve: %{service}, %{name}"
      title: "A booking is waiting for your approval"
      intro: "%{name} asked to book %{service}:"
      email: "Email: %{email}"
      deadline: "Without an answer by %{deadline} the request is declined and the time is released."
      see: "See it in your responses: %{url}"
      see_link: "See it in your responses"
    reminder:
      subject: "Reminder: %{service}, %{time}"
      title: "Your booking is coming up"
      intro: "%{service} is booked for:"
      reply: "Questions? Reply to this email to reach the organizer."
      manage: "See or cancel your booking: %{url}"
      manage_link: "See or cancel your booking"
    cancelled:
      subject: "Cancelled: %{service}, %{time}"
      title: "Your booking was cancelled"
      intro: "%{service} is cancelled for:"
      reply: "Questions? Reply to this email to reach the organizer."
    new_booking:
      subject: "New booking: %{service}, %{name}"
      someone: "Someone"
      title: "New booking"
      intro: "%{name} booked %{service}:"
      email: "Email: %{email}"
      see: "See it in your responses: %{url}"
      see_link: "See it in your responses"
