# Security harness (tmp/plan.md, Seção 5): the production API image against a throwaway Postgres
# and Valkey on a network with no Internet and no published ports. Run it with
# .ci/security/run.sh, never with `docker stack` and never against production.
name: kurzsec

x-api-env: &api-env
  RAILS_ENV: production
  # Generated per run by run.sh; the harness never touches a real secret.
  SECRET_KEY_BASE: ${SEC_SECRET_KEY_BASE:?run through .ci/security/run.sh}
  POSTGRES_HOST: db
  POSTGRES_USER: kurz_app
  POSTGRES_PASSWORD: kurz_app
  POSTGRES_DB: production
  REDIS_URL: redis://cache:6379/0
  FRONTEND_URL: https://kurz.fyi
  SKIP_DB_PREPARE: "1"
  LOG_REQUESTS: "false"
  MCP_ENABLED: "true"
  # Dummy DSN (no route out of the network): makes production boot run config/initializers/sentry.rb.
  SENTRY_DSN: http://key@localhost/1
  SENTRY_LOGGER: "1"
  IMGPROC_URL: http://imgproc:8080

networks:
  sec:
    internal: true
  imgnet:
    internal: true

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: production
    volumes:
      - ./security/roles.sql:/docker-entrypoint-initdb.d/roles.sql:ro
    networks: [sec]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  cache:
    image: valkey/valkey:8.1.4
    networks: [sec]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    image: kurzsec-api
    build:
      context: ..
      dockerfile: .ci/Dockerfile
    # The entrypoint runs db:prepare unless SKIP_DB_PREPARE=1.
    environment:
      <<: *api-env
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      SKIP_DB_PREPARE: "0"
    command: ["true"]
    networks: [sec]
    depends_on:
      db: { condition: service_healthy }
      cache: { condition: service_healthy }

  imgproc:
    image: kurzsec-api
    command: ["bundle", "exec", "puma", "-b", "tcp://0.0.0.0:8080", "-t", "2:2", "imgproc/config.ru"]
    environment:
      SKIP_DB_PREPARE: "1"
    networks: [imgnet]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/up"]
      interval: 3s
      timeout: 5s
      retries: 40

  api:
    image: kurzsec-api
    environment: *api-env
    networks:
      sec:
        # The production hostname, so Host-header checks use the real value.
        aliases: [api.kurz.fyi]
      imgnet:
    depends_on:
      migrate: { condition: service_completed_successfully }
      imgproc: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "Host: api.kurz.fyi", "http://localhost/up"]
      interval: 3s
      timeout: 5s
      retries: 40

  # Runs the Ruby suite inside the production image, on the isolated network.
  rails:
    image: kurzsec-api
    environment:
      <<: *api-env
      SENTRY_DSN: ""
    volumes:
      - ./security:/security:ro
    networks: [sec, imgnet]
    profiles: [tools]
    depends_on:
      migrate: { condition: service_completed_successfully }
