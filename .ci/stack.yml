services:
  web:
    image: pizito:5001/shortener:latest
    environment:
      - RAILS_ENV=production
      # deploy.sh migrates before the rollout (see bin/docker-entrypoint).
      - SKIP_DB_PREPARE=1
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - REDIS_URL=${REDIS_URL}
      - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
      - EDGE_API=${EDGE_API}
      - GMAIL_USERNAME=${GMAIL_USERNAME}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      # Resend replaces Gmail when MAIL_PROVIDER=resend (backend/config/mail_settings.rb).
      - MAIL_PROVIDER=${MAIL_PROVIDER:-gmail}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - MAIL_FROM=${MAIL_FROM:-Kurz <login@kurz.fyi>}
      - MAIL_DAILY_LIMIT=${MAIL_DAILY_LIMIT:-100}
      - MAIL_MONTHLY_LIMIT=${MAIL_MONTHLY_LIMIT:-3000}
      - MAIL_NEW_ADDRESS_DAILY_LIMIT=${MAIL_NEW_ADDRESS_DAILY_LIMIT:-40}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      - TURNSTILE_HOSTNAMES=kurz.fyi
      - FRONTEND_URL=${FRONTEND_URL}
      - SENTRY_DSN=${SENTRY_DSN}
      - SENTRY_LOGGER=1
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_BUCKET=${S3_BUCKET}
    networks:
      - proxy_net
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2'
          memory: 2048M
  
  workers:
    image: pizito:5001/shortener:latest
    command: bundle exec rake workers:run
    networks:
      - proxy_net
    environment:
      - RAILS_ENV=production
      # deploy.sh migrates before the rollout (see bin/docker-entrypoint).
      - SKIP_DB_PREPARE=1
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - REDIS_URL=${REDIS_URL}
      - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
      - GMAIL_USERNAME=${GMAIL_USERNAME}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - FRONTEND_URL=${FRONTEND_URL}
      - SENTRY_DSN=${SENTRY_DSN}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1024M
  
  jobs:
    image: pizito:5001/shortener:latest
    command: bin/jobs
    networks:
      - proxy_net
    environment:
      - RAILS_ENV=production
      # deploy.sh migrates before the rollout (see bin/docker-entrypoint).
      - SKIP_DB_PREPARE=1
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - REDIS_URL=${REDIS_URL}
      - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
      - GMAIL_USERNAME=${GMAIL_USERNAME}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      # Resend replaces Gmail when MAIL_PROVIDER=resend (backend/config/mail_settings.rb).
      - MAIL_PROVIDER=${MAIL_PROVIDER:-gmail}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - MAIL_FROM=${MAIL_FROM:-Kurz <login@kurz.fyi>}
      - MAIL_DAILY_LIMIT=${MAIL_DAILY_LIMIT:-100}
      - MAIL_MONTHLY_LIMIT=${MAIL_MONTHLY_LIMIT:-3000}
      - MAIL_NEW_ADDRESS_DAILY_LIMIT=${MAIL_NEW_ADDRESS_DAILY_LIMIT:-40}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      - TURNSTILE_HOSTNAMES=kurz.fyi
      - FRONTEND_URL=${FRONTEND_URL}
      - SENTRY_DSN=${SENTRY_DSN}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_BUCKET=${S3_BUCKET}
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M
  
  serveless:
    image: pizito:5001/shortener-edge:latest
    working_dir: /app
    environment:
      - RAILS_ENV=production
      - FRONTEND_URL=${FRONTEND_URL}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - REDIS_URL=${REDIS_URL}
    networks:
      - proxy_net

networks:
  proxy_net:
    external: true